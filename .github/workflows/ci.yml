name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Verify the task module
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - name: Check out the repository (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned tools (jdx/mise-action v5.2.8)
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785
        with:
          version: 2026.11.8
      - name: Install the pinned Lean toolchain (leanprover/lean-action v1.7.1)
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: proofs
          auto-config: "false"
          build: "false"
          use-mathlib-cache: "false"
      - run: npm ci
      - run: npm run release:check
      - run: verify/run
      - run: npm audit
